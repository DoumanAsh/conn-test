name: Release

permissions:
  # Attaching binary to release requires write perms
  contents: write

on:
  release:
    types:
      - created
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  rust:
    if: github.event.pull_request.draft == false
    uses: DoumanAsh/douman-ci/.github/workflows/release-rust.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      file_suffix: "conn-test-"
      github_repositroy: $GITHUB_REPOSITORY
      github_release_event_path: $GITHUB_EVENT_PATH
      github_upload_release: ${{ github.event_name != 'pull_request' }}
      cargo-binaries: "conn-test"
