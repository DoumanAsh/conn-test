name: Release

permissions:
  # Attaching binary to release requires write perms
  contents: write

on:
  release:
    types:
      - created

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust Unix
      if: runner.os != 'Windows'
      run: |
        if rustup --version >/dev/null 2>&1; then
            rustup update
        else
             curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
             echo ::add-path::$HOME/.cargo/bin
        fi
    - name: Install Rust Windows
      if: runner.os == 'Windows'
      run: |
        if (Get-Command "rustup" -ErrorAction SilentlyContinue) {
            rustup update
        } else {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/i686-pc-windows-gnu/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain stable
            echo ::add-path::%USERPROFILE%\.cargo\bin
        }

    - name: Rust version
      run: |
        cargo --version
        rustc --version

    - name: Install cargo auditable
      uses: DoumanAsh/douman-ci/.github/actions/install-cargo-auditable@master

    - name: Build release Win
      if: runner.os == 'Windows'
      run: |
        Invoke-Expression "cargo auditable build --release"
        Compress-Archive -Path target/release/conn-test.exe -Destination conn-test-${{runner.os}}.zip

    - name: Build release Unix
      if: runner.os != 'Windows'
      run: |
        cargo auditable build --release
        zip -j conn-test-${{runner.os}}.zip target/release/conn-test

    - name: Upload to release Unix
      if: runner.os != 'Windows'
      run: |
        curl \
          -f \
          -sSL \
          -XPOST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/zip" \
          --upload-file "conn-test-${{runner.os}}.zip" \
          "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$(jq --raw-output '.release.id' $GITHUB_EVENT_PATH)/assets?name=conn-test-${{runner.os}}.zip"

    - name: Upload to release Windows
      if: runner.os == 'Windows'
      run: |
        $headers = @{"Authorization"="token ${{ secrets.GITHUB_TOKEN }}" };
        $event = Get-Content -Raw -Path $env:GITHUB_EVENT_PATH | ConvertFrom-Json;
        $url = "https://uploads.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/$($event.release.id)/assets?name=conn-test-${{runner.os}}.zip";
        Invoke-WebRequest -Headers $headers -Method POST -Infile conn-test-${{runner.os}}.zip -ContentType 'application/zip' -Uri $url

  musl-linux-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
    - uses: actions/checkout@v7

    - name: Determine rustc target
      id: rustc
      shell: sh
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        case "$ARCH" in \
            amd64) rustArch='x86_64-unknown-linux-musl' ;; \
            arm64) rustArch='aarch64-unknown-linux-musl' ;; \
            *) echo >&2 "unsupported architecture: $ARCH"; exit 1 ;; \
        esac; \
        echo "target=$rustArch" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.arch }}

    - name: Build ${{ steps.rustc.outputs.target }} target
      shell: sh
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace --platform linux/${{ matrix.arch }} ghcr.io/doumanash/rust-musl:latest cargo auditable build --release --target ${{ steps.rustc.outputs.target }}
        zip -j conn-test-${{ steps.rustc.outputs.target }}.zip target/${{ steps.rustc.outputs.target }}/release/conn-test

    - name: Upload to release Unix
      run: |
        curl \
          -f \
          -sSL \
          -XPOST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/zip" \
          --upload-file "conn-test-${{ steps.rustc.outputs.target }}.zip" \
          "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$(jq --raw-output '.release.id' $GITHUB_EVENT_PATH)/assets?name=conn-test-${{ steps.rustc.outputs.target }}.zip"
